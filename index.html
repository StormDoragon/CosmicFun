<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A funny space-themed excuse generator that creates absurd cosmic excuses for everyday situations." />
  <meta name="keywords" content="cosmic excuse generator, funny excuse generator, space humor, random excuses, web app" />
  <meta name="author" content="Cosmic Excuse Generator" />

  <meta property="og:title" content="Cosmic Excuse Generator" />
  <meta property="og:description" content="Generate highly advanced explanations for extremely ordinary failures." />
  <meta property="og:type" content="website" />

  <title>Cosmic Excuse Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero-card" aria-labelledby="app-title">
      <div class="badge">Orbitally Unnecessary Tool #001</div>

      <h1 id="app-title">Cosmic Excuse Generator</h1>
      <p class="subtitle">
        Generate suspiciously polished explanations for ordinary human failures.
      </p>

      <div class="advanced-controls" aria-label="Advanced generator controls">
        <label class="field" for="toneSelect">
          <span>Tone</span>
          <select id="toneSelect">
            <option value="classic">Classic Cosmic</option>
            <option value="professional">Professional Spin</option>
            <option value="dramatic">Overdramatic</option>
            <option value="chaotic">Chaotic Goblin</option>
          </select>
        </label>
        <label class="field" for="situationInput">
          <span>Situation (optional)</span>
          <input id="situationInput" type="text" maxlength="80" placeholder="e.g. missed standup, late homework, forgot dishes" />
        </label>
      </div>

      <div class="controls" aria-label="Excuse category selector">
        <button type="button" class="chip active" data-category="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-category="work" aria-pressed="false">Work</button>
        <button type="button" class="chip" data-category="school" aria-pressed="false">School</button>
        <button type="button" class="chip" data-category="trading" aria-pressed="false">Trading</button>
        <button type="button" class="chip" data-category="family" aria-pressed="false">Family</button>
      </div>

      <article id="excuse" class="excuse-box" aria-live="polite">
        Click generate. The universe is warming up its alibi engine.
      </article>

      <div class="button-row">
        <button type="button" id="generateBtn" class="primary-btn">Generate Excuse</button>
        <button type="button" id="generateThreeBtn" class="secondary-btn">Generate 100</button>
        <button type="button" id="saveBtn" class="secondary-btn">Save Favorite</button>
        <button type="button" id="copyBtn" class="secondary-btn">Copy</button>
        <button type="button" id="shareBtn" class="secondary-btn">Share</button>
      </div>

      <section class="output-stack" aria-label="Generated excuse list">
        <h2 class="output-title">Batch Output</h2>
        <ul id="batchList" class="batch-list"></ul>
      </section>

      <section class="output-stack" aria-label="Recently saved excuses">
        <h2 class="output-title">Favorites</h2>
        <ul id="favoritesList" class="batch-list"></ul>
      </section>

      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
